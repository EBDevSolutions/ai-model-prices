name: Update AI prices

on:
  schedule:
    # Every 30 minutes, offset from the busy top of the hour (UTC).
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-ai-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Update official prices
        run: python scripts/update_prices.py

      - name: Commit changed data
        shell: bash
        run: |
          if git diff --quiet -- data/prices.json data/history.json; then
            echo "No data files changed."
            exit 0
          fi
          git config user.name "AI Price Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prices.json data/history.json
          git commit -m "chore(data): refresh AI prices"
          git push
