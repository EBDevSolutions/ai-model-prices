name: Update AI prices

on:
  schedule:
    # Every 30 minutes, offset from the busy top of the hour (UTC).
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-ai-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Update official prices
        run: python scripts/update_prices.py

      - name: Update verified benchmark coverage
        id: benchmarks
        continue-on-error: true
        run: python scripts/update_benchmarks.py

      - name: Report benchmark source failure
        if: steps.benchmarks.outcome == 'failure'
        run: echo '::warning::Benchmark update failed; retaining previous research data and publishing independently refreshed prices.'

      - name: Update Artificial Analysis research
        id: research
        continue-on-error: true
        run: python scripts/update_research.py

      - name: Report research source failure
        if: steps.research.outcome == 'failure'
        run: echo '::warning::Artificial Analysis update failed; last good observations retained with source error status.'

      - name: Commit changed data
        shell: bash
        run: |
          if git diff --quiet -- data/prices.json data/history.json data/benchmarks.json data/research.json; then
            echo "No data files changed."
            exit 0
          fi
          git config user.name "AI Price Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prices.json data/history.json data/benchmarks.json data/research.json
          git commit -m "chore(data): refresh AI prices and benchmarks"
          git push
